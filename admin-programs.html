<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاب لاب</title><link rel="icon" type="image/png" href="assets/fablab-logo-header.svg.png"><link rel="stylesheet" href="assets/style.css"><style>.admin-programs{max-width:1180px;margin:45px auto 80px;padding:0 20px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.admin-head h1{margin:0}.admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.admin-card{background:#fff;border:1px solid #e3e9f1;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #13203310}.admin-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.admin-body{padding:17px}.admin-body h2{font-size:19px;margin:8px 0}.admin-body p{color:#718096;line-height:1.8;font-size:13px;margin:0 0 12px}.available,.finished{display:inline-flex;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800}.available{background:#e9f8ef;color:#16834b}.finished{background:#f1f3f5;color:#667085}@media(max-width:900px){.admin-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="admin-programs"><div class="admin-head"><div><span class="eyebrow">ADMIN</span><h1>البرامج</h1><p class="muted">قائمة البرامج تُحدّث تلقائيًا من النظام.</p></div><div><a class="btn light" href="admin.html">العودة للمدير</a> <a class="btn primary" href="programs.html">عرض الموقع</a></div></div><div id="adminGrid" class="admin-grid"><p>جاري تحميل البرامج...</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){const S='https://nwlqroyagrfuzfrtikln.supabase.co',K='sb_publishable_AqI5cuM8pFcrc2UsiC-1zA_Sullikq7',sb=supabase.createClient(S,K);const {data:{session}}=await sb.auth.getSession();if(!session||session.user.email!=='admin@fablab.local'){location.href='login.html';return}const {data,error}=await sb.from('programs').select('name,image,starts_at,ends_at,time_text,price,status').order('status',{ascending:false}).order('starts_at',{ascending:true});const grid=document.getElementById('adminGrid');if(error){grid.innerHTML='<p>تعذر تحميل البرامج حاليًا.</p>';return}grid.innerHTML=(data||[]).map(p=>{const a=p.status==='available';const d=p.starts_at?(p.starts_at+' – '+(p.ends_at||p.starts_at)):'';return '<article class="admin-card">'+(p.image?'<img src="'+p.image.replace(/"/g,'&quot;')+'" alt="">':'')+'<div class="admin-body"><span class="'+(a?'available':'finished')+'">'+(a?'متاح للتسجيل':'منتهي')+'</span><h2>'+String(p.name).replace(/[&<>]/g,'')+'</h2><p>'+d+' · '+(p.price==null?'حسب الإعلان':p.price+' ريال')+'<br>'+String(p.time_text||'').replace(/[&<>]/g,'')+'</p></div></article>'}).join('')||'<p>لا توجد برامج.</p>';})().catch(()=>{location.href='login.html'});</script><script src="title-fix.js"></script></body></html>

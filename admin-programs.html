<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاب لاب</title><link rel="icon" type="image/png" href="assets/fablab-logo-header.svg.png"><link rel="stylesheet" href="assets/style.css"><style>.admin-programs{max-width:1180px;margin:45px auto 80px;padding:0 20px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.admin-head h1{margin:0}.program-form{background:#fff;border:1px solid #e3e9f1;border-radius:22px;padding:24px;margin-bottom:28px;box-shadow:0 8px 25px #13203310}.program-form h2{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.program-form label{display:flex;flex-direction:column;gap:7px;font-weight:700;color:#344054}.program-form input,.program-form textarea{font:inherit;border:1px solid #d8e0ea;border-radius:12px;padding:12px;background:#fff}.program-form textarea{min-height:130px;resize:vertical}.full-field{grid-column:1/-1}.form-actions{display:flex;align-items:center;gap:12px;margin-top:18px}.admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.admin-card{background:#fff;border:1px solid #e3e9f1;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #13203310}.admin-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.admin-body{padding:17px}.admin-body h2{font-size:19px;margin:8px 0}.admin-body p{color:#718096;line-height:1.8;font-size:13px;margin:0 0 12px}.available,.finished{display:inline-flex;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800}.available{background:#e9f8ef;color:#16834b}.finished{background:#f1f3f5;color:#667085}.admin-status{margin-top:10px;color:#667085;font-size:12px}@media(max-width:900px){.admin-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.full-field{grid-column:auto}}</style></head><body><main class="admin-programs"><div class="admin-head"><div><span class="eyebrow">ADMIN</span><h1>إدارة البرامج</h1><p class="muted">أضف البرنامج مرة واحدة، وسيظهر تلقائيًا في الرئيسية وصفحة البرامج وصفحة التفاصيل.</p></div><div><a class="btn light" href="admin.html">العودة للمدير</a> <a class="btn primary" href="programs.html">عرض الموقع</a></div></div><section class="program-form"><h2>➕ إضافة برنامج جديد</h2><form id="programForm"><div class="form-grid"><label>اسم البرنامج<input id="name" required maxlength="120" placeholder="مثال: SPIKE Essential"></label><label>صورة الإعلان<input id="image" type="file" accept="image/png,image/jpeg,image/webp" required></label><label>تاريخ البداية<input id="starts_at" type="date" required></label><label>تاريخ النهاية<input id="ends_at" type="date" required></label><label>الوقت<input id="time_text" required maxlength="120" placeholder="مثال: 4:00 - 7:00 مساءً"></label><label>السعر (ريال)<input id="price" type="number" min="0" step="0.01" placeholder="600"></label><label>الفئة العمرية<input id="age_text" maxlength="80" placeholder="مثال: 13 سنة فأعلى"></label><label>مدة البرنامج<input id="duration_text" maxlength="80" placeholder="مثال: 3 أسابيع"></label><label>الموقع<input id="location_text" maxlength="150" placeholder="فاب لاب الأحساء"></label><label>رابط التسجيل <span class="muted">(اختياري)</span><input id="registration_url" type="url" placeholder="https://..."></label><label class="full-field">نبذة / وصف البرنامج<textarea id="description" required maxlength="3000" placeholder="اكتب وصف البرنامج الذي سيظهر في الإعلان وصفحة التفاصيل..."></textarea></label></div><div class="form-actions"><button class="btn primary" type="submit">نشر البرنامج</button><span id="formStatus" class="muted"></span></div></form></section><section><h2>البرامج المنشورة</h2><div id="adminGrid" class="admin-grid"><p>جاري تحميل البرامج...</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){const S='https://nwlqroyagrfuzfrtikln.supabase.co',K='sb_publishable_AqI5cuM8pFcrc2UsiC-1zA_Sullikq7',sb=supabase.createClient(S,K);const session=(await sb.auth.getSession()).data.session;if(!session||session.user.email!=='admin@fablab.local'){location.href='login.html';return}const esc=s=>String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));function state(p){const t=new Date();t.setHours(0,0,0,0);const s=p.starts_at?new Date(p.starts_at+'T00:00:00'):null,e=p.ends_at?new Date(p.ends_at+'T23:59:59'):s;if(e&&e<t)return'finished';if(s&&s>t)return'upcoming';return'current'}function label(p){return state(p)==='finished'?['منتهي','finished']:['متاح للتسجيل','available']}async function load(){const {data,error}=await sb.from('programs').select('*').order('starts_at',{ascending:false});const grid=document.getElementById('adminGrid');if(error){grid.innerHTML='<p>تعذر تحميل البرامج.</p>';return}grid.innerHTML=(data||[]).map(p=>{const [l,c]=label(p);return '<article class="admin-card">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'')+'<div class="admin-body"><span class="'+c+'">'+l+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.description)+'</p><div class="admin-status">📅 '+esc(p.starts_at||'')+' – '+esc(p.ends_at||'')+'<br>🕐 '+esc(p.time_text||'حسب الإعلان')+'<br>💰 '+(p.price==null?'حسب الإعلان':esc(p.price)+' ريال')+'</div></div></article>'}).join('')||'<p>لا توجد برامج.</p>'}const form=document.getElementById('programForm');form.addEventListener('submit',async e=>{e.preventDefault();const currentForm=e.currentTarget,status=document.getElementById('formStatus'),btn=currentForm.querySelector('button');btn.disabled=true;status.textContent='جاري نشر البرنامج...';try{const name=document.getElementById('name').value.trim(),description=document.getElementById('description').value.trim(),starts_at=document.getElementById('starts_at').value,ends_at=document.getElementById('ends_at').value,time_text=document.getElementById('time_text').value.trim(),price=document.getElementById('price').value,age_text=document.getElementById('age_text').value.trim(),duration_text=document.getElementById('duration_text').value.trim(),location_text=document.getElementById('location_text').value.trim(),registrationInput=document.getElementById('registration_url').value.trim(),registration_url=registrationInput||null,file=document.getElementById('image').files[0];if(ends_at<starts_at)throw Error('تاريخ النهاية يجب أن يكون بعد أو مساويًا لتاريخ البداية.');if(!file)throw Error('اختر صورة الإعلان.');const existing=await sb.from('programs').select('id').eq('name',name).limit(1);if(existing.error)throw existing.error;if(existing.data&&existing.data.length)throw Error('هذا البرنامج موجود مسبقًا. إذا كنت تريد تحديثه استخدم الاسم الحالي أو عدّل البرنامج الموجود بدلًا من إضافته مرة أخرى.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await sb.storage.from('program-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const image=sb.storage.from('program-images').getPublicUrl(path).data.publicUrl;const ins=await sb.from('programs').insert({name,description,image,starts_at,ends_at,time_text,price:price===''?null:Number(price),status:'available',age_text,duration_text,location_text,registration_url}).select().single();if(ins.error){if(ins.error.code==='23505')throw Error('هذا البرنامج موجود مسبقًا.');throw ins.error}status.textContent='تم نشر البرنامج بنجاح وسيظهر تلقائيًا في صفحات الموقع.';currentForm.reset();await load()}catch(err){console.error(err);status.textContent=err.message||'تعذر نشر البرنامج.'}finally{btn.disabled=false}});load()})().catch(()=>location.href='login.html');</script><script src="title-fix.js"></script></body></html>

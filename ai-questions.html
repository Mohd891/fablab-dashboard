<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاب لاب</title><link rel="icon" type="image/png" href="assets/fablab-logo-header.svg.png"><link rel="apple-touch-icon" href="assets/fablab-logo-header.svg.png"><link rel="stylesheet" href="assets/style.css"><style>
body{background:#f7f9fc}.aiq-wrap{max-width:1100px;margin:0 auto;padding:28px 18px}.aiq-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.aiq-head h1{margin:0}.aiq-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.aiq-tools input{min-width:260px;border:1px solid #dce3eb;border-radius:10px;padding:11px 13px;background:#fff}.aiq-card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;overflow:hidden}.aiq-row{padding:18px;border-bottom:1px solid #edf0f4}.aiq-row:last-child{border-bottom:0}.aiq-meta{font-size:12px;color:#7b8798;margin-bottom:9px}.aiq-q{font-weight:800;color:#253348;margin-bottom:8px}.aiq-a{color:#536176;white-space:pre-wrap;line-height:1.8}.empty{padding:40px;text-align:center;color:#7b8798}.back{display:inline-block;margin-bottom:15px}.danger{color:#b42318}
</style></head><body><div class="aiq-wrap"><a class="back" href="admin.html">← العودة للوحة الإدارة</a><div class="aiq-head"><div><span class="eyebrow">AI ASSISTANT</span><h1>أسئلة المساعد</h1><p class="muted">هنا تظهر أسئلة الزوار وإجابات المساعد لمراجعتها وتحسين المعلومات.</p></div><div class="aiq-tools"><input id="search" placeholder="ابحث في الأسئلة أو الإجابات..."><button id="refresh" class="btn primary">تحديث</button></div></div><div id="status" class="muted" style="margin-bottom:12px">جاري التحميل...</div><div id="list" class="aiq-card"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://nwlqroyagrfuzfrtikln.supabase.co';const KEY='sb_publishable_AqI5cuM8pFcrc2UsiC-1zA_Sullikq7';const sb=supabase.createClient(SUPABASE_URL,KEY);let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){const status=document.getElementById('status'),list=document.getElementById('list');status.textContent='جاري تحميل الأسئلة...';const {data:sessionData}=await sb.auth.getSession();if(!sessionData.session){location.href='login.html';return}if(sessionData.session.user.email!=='admin@fablab.local'){status.textContent='غير مصرح لك بالدخول.';status.className='danger';return}const {data,error}=await sb.from('ai_chat_logs').select('id,question,answer,created_at').order('created_at',{ascending:false});if(error){console.error(error);status.textContent='تعذر تحميل الأسئلة. تأكد من صلاحيات المدير.';status.className='danger';return}rows=data||[];draw();}
function draw(){const q=(document.getElementById('search').value||'').trim().toLowerCase();const filtered=rows.filter(r=>`${r.question} ${r.answer}`.toLowerCase().includes(q));document.getElementById('status').textContent=`عدد المحادثات المحفوظة: ${filtered.length}${q?' (من '+rows.length+')':''}`;document.getElementById('list').innerHTML=filtered.length?filtered.map((r,i)=>`<article class="aiq-row"><div class="aiq-meta">#${i+1} · ${esc(new Date(r.created_at).toLocaleString('ar-SA'))}</div><div class="aiq-q">السؤال: ${esc(r.question)}</div><div class="aiq-a"><b>الإجابة:</b><br>${esc(r.answer)}</div></article>`).join(''):'<div class="empty">لا توجد أسئلة محفوظة.</div>';}
document.getElementById('search').addEventListener('input',draw);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>

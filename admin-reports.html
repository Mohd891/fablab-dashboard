<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز التقارير | فاب لاب الأحساء</title><link rel="stylesheet" href="assets/style.css"><style>body{background:#f5f8fc}.rp{max-width:1350px;margin:28px auto;padding:0 16px}.rp-card{background:#fff;border:1px solid #e4eaf2;border-radius:22px;padding:22px;margin-bottom:18px}.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rp-btn{border:1px solid #d8e1ec;background:#fff;border-radius:13px;padding:16px;text-align:right;cursor:pointer;font:inherit;font-weight:800}.rp-btn:hover{border-color:#2867df;transform:translateY(-1px)}.rp-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.rp-kpis>div{background:#f5f8ff;border-radius:15px;padding:16px}.rp-kpis b{display:block;font-size:27px;color:#173f6d}.rp-kpis span{color:#718096}.report-group{margin-top:22px}.report-group h3{margin-bottom:10px}.rp-preview-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.rp-table{width:100%;border-collapse:collapse}.rp-table th,.rp-table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right}.rp-table th{background:#f7f9fc}@media(max-width:900px){.rp-grid{grid-template-columns:repeat(2,1fr)}.rp-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.rp-grid{grid-template-columns:1fr}.rp-kpis{grid-template-columns:1fr}.rp-preview-head{display:block}}</style></head><body data-page="admin-reports"><main class="rp"><div id="reportsApp">جاري تحميل التقارير...</div></main><script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-integration.js"></script><script src="evaluation-cloud-sync.js?v=20260909-1"></script><script src="admin-reports.js?v=20260909-3"></script></body></html>

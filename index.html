<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرئيسية | فاب لاب الأحساء</title><link rel="icon" type="image/png" href="assets/fablab-logo.png"><link rel="apple-touch-icon" href="assets/fablab-logo.png"><link rel="stylesheet" href="assets/style.css"><style>.program-card{overflow:hidden;padding:0;position:relative}.program-card .program-image{width:100%;height:175px;display:block;object-fit:cover;object-position:center;background:#eef4ff}.program-card .program-content{padding:20px 23px 23px}.program-card .program-content .icon{margin-bottom:12px}.program-card h3{margin:10px 0 8px}.program-card:hover .program-image{transform:scale(1.03);transition:transform .25s ease}.program-card .program-image{transition:transform .25s ease}@media(max-width:650px){.program-card .program-image{height:190px}}</style></head><body data-page="home"><script src="app.js?v=20260903"></script><script>setTimeout(function(){var images={'الروبوتات الذكية':'assets/program-alam-robot.png','نبض الكهرباء':'assets/program-nabd-electric.png','صناع المستقبل':'assets/program-mubtaker-electronic.png','هندسة الإبداع':'assets/program-hendassat-alibda.png','صناع الواقع':'assets/program-mubtaker-electronic.png','VEX':'assets/program-barmej-robotak.png'};document.querySelectorAll('.program-card').forEach(function(card){var title=card.querySelector('h3');if(!title||card.querySelector('.program-image'))return;var name=title.textContent.trim();var src=images[name];if(!src)return;var img=document.createElement('img');img.className='program-image';img.src=src;img.alt=name;var content=document.createElement('div');content.className='program-content';while(card.firstChild)content.appendChild(card.firstChild);card.appendChild(img);card.appendChild(content)});var grid=document.querySelector('.program-grid');if(grid&&!document.querySelector('.game-promo')){var game=document.createElement('section');game.className='game-promo';game.innerHTML='<div class="game-promo-icon">🎮</div><div class="game-promo-copy"><span class="eyebrow">FAB LAB CHALLENGE</span><h2>جرب لعبة فاب لاب</h2><p>اختبر سرعتك خلال 20 ثانية، واضغط على الأشكال بأسرع ما تقدر واجمع أكبر عدد من النقاط!</p></div><a class="btn primary large" href="game.html">ابدأ اللعب</a>';grid.parentNode.insertBefore(game,grid.parentNode.firstChild)}},400);</script></body></html>

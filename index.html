<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرئيسية | فاب لاب الأحساء</title><link rel="icon" type="image/png" href="assets/fablab-logo.png"><link rel="apple-touch-icon" href="assets/fablab-logo.png"><link rel="stylesheet" href="assets/style.css"><style>.author-phone{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:10px;color:#25d366;font-weight:700}.author-phone:hover{text-decoration:underline}.author-phone svg{width:16px;height:16px;flex:0 0 16px}.home-programs-real{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px!important;margin-top:24px}.home-program-card{background:#fff;border:1px solid #e3e9f1;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #13203310;transition:.2s}.home-program-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #13203316}.home-program-card img{display:block;width:100%;height:200px;object-fit:cover}.home-program-card .body{padding:14px 16px 16px}.home-program-card .tag{margin-bottom:7px}.home-program-card h3{font-size:18px;margin:4px 0 0}.home-program-card .view-only{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:8px;background:#f1f3f7;color:#68758a;font-size:10px;font-weight:700}@media(max-width:900px){.home-programs-real{grid-template-columns:repeat(2,minmax(0,1fr))!important}}@media(max-width:560px){.home-programs-real{grid-template-columns:1fr!important}.home-program-card img{height:190px}}</style></head><body data-page="home"><script src="app.js?v=20260903"></script><script>document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){var grid=document.querySelector('.program-grid');if(!grid)return;var items=[['assets/program-hendassat-alibda.png','معسكر','هندسة الإبداع'],['assets/program-barmej-robotak.png','معسكر','برمج روبوتك'],['assets/program-mubtaker-electronic.png','معسكر','المبتكر الإلكتروني'],['assets/program-alam-robot.png','معسكر','عالم الروبوت'],['assets/program-nabd-electric.png','معسكر','نبض الكهرباء']];grid.className='home-programs-real';grid.innerHTML=items.map(function(x){return '<article class="home-program-card"><img src="'+x[0]+'" alt="'+x[2]+'"><div class="body"><span class="tag">'+x[1]+'</span><h3>'+x[2]+'</h3><span class="view-only">للاطلاع فقط · التسجيل غير متاح</span></div></article>'}).join('')},250)});</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاب لاب</title><link rel="icon" href="assets/fablab-logo-header.svg.png"><link rel="stylesheet" href="assets/style.css"><style>.gp{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f8fb}.gp-card{width:min(520px,100%);background:#fff;border:1px solid #e3e9f1;border-radius:24px;padding:30px;box-shadow:0 20px 60px #13203312}.gp-card h1{margin:0 0 8px}.gp-card p{color:#718096;line-height:1.8}.gp-form{display:grid;gap:14px}.gp-form label{display:grid;gap:7px;font-weight:700}.gp-form input,.gp-form select{font:inherit;padding:12px;border:1px solid #d8e0ea;border-radius:12px}.gp-btn{margin-top:5px}.gp-msg{text-align:center;margin-top:12px;font-size:13px}</style></head><body><main class="gp"><section class="gp-card"><div style="text-align:center"><img src="assets/fablab-logo.png" alt="فاب لاب" style="width:100px"></div><h1>أكمل بيانات حسابك</h1><p id="intro">تم تسجيل الدخول باستخدام Google. نحتاج رقم الجوال والعمر والجنس مرة واحدة فقط حتى يكتمل حسابك وتقدر تستخدم الحجوزات والبرامج.</p><form id="gpForm" class="gp-form"><label>رقم الجوال<input id="phone" required inputmode="tel" placeholder="05xxxxxxxx"></label><label>العمر<input id="age" type="number" min="7" max="80" required></label><label>الجنس<select id="gender" required><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select></label><button class="btn primary full gp-btn">حفظ والدخول</button></form><div id="msg" class="gp-msg"></div></section></main><script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S='https://nwlqroyagrfuzfrtikln.supabase.co',K='sb_publishable_AqI5cuM8pFcrc2UsiC-1zA_Sullikq7';const sb=supabase.createClient(S,K);function phone(v){v=String(v||'').trim().replace(/[\s()-]/g,'');if(/^05\d{8}$/.test(v))return v;if(/^\+9665\d{8}$/.test(v))return'0'+v.slice(4);if(/^9665\d{8}$/.test(v))return'0'+v.slice(3);return null}async function init(){const {data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('login.html');return}const u=data.session.user,db=loadDB(),email=String(u.email||'').toLowerCase(),name=String(u.user_metadata?.full_name||u.user_metadata?.name||email.split('@')[0]).trim();let local=db.users.find(x=>String(x.email||'').toLowerCase()===email);if(!local){local={id:'google-'+u.id,name,email,password:'',role:'student',active:true,provider:'google'};db.users.push(local);saveDB(db)}else{local.name=name||local.name;local.provider='google';local.active=true;saveDB(db)}const old=db.students?.find(x=>String(x.email||'').toLowerCase()===email);if(old?.phone){setSession(local);location.replace('portal.html');return}document.getElementById('gpForm').addEventListener('submit',async e=>{e.preventDefault();const p=phone(document.getElementById('phone').value),age=Number(document.getElementById('age').value),gender=document.getElementById('gender').value,msg=document.getElementById('msg');if(!p){msg.textContent='رقم الجوال غير صحيح.';return}if(!Number.isInteger(age)||age<7||age>80){msg.textContent='العمر غير صحيح.';return}if(db.students.some(x=>phone(x.phone)===p&&String(x.email||'').toLowerCase()!==email)){msg.textContent='رقم الجوال مسجل من قبل.';return}msg.textContent='جاري حفظ البيانات...';const r=await sb.rpc('create_student_registration',{p_full_name:name,p_phone:p,p_email:email,p_age:age,p_gender:gender,p_program:''});if(r.error&&!String(r.error.message||'').includes('EMAIL_EXISTS')){msg.textContent='تعذر حفظ البيانات حاليًا. حاول مرة أخرى.';console.error(r.error);return}local.name=name;local.phone=p;local.provider='google';const idx=db.users.findIndex(x=>x.id===local.id);if(idx>=0)db.users[idx]=local;db.students=db.students||[];const student={id:local.id,userId:local.id,name,email,phone:p,age,gender,createdAt:old?.createdAt||new Date().toISOString(),provider:'google',cloudRegistrationId:r.data?.id||old?.cloudRegistrationId||null};const si=db.students.findIndex(x=>String(x.email||'').toLowerCase()===email);if(si>=0)db.students[si]=student;else db.students.push(student);saveDB(db);setSession(local);location.replace('portal.html')})}init();</script><script src="title-fix.js"></script></body></html>

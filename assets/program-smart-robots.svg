<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080812"/><stop offset=".55" stop-color="#211050"/><stop offset="1" stop-color="#f59a28"/></linearGradient></defs><rect width="900" height="1125" fill="url(#g)"/><circle cx="130" cy="170" r="180" fill="#6844ff" opacity=".18"/><text x="450" y="105" fill="white" font-size="30" text-anchor="middle" font-family="Arial">فاب لاب الأحساء</text><text x="450" y="170" fill="white" font-size="28" text-anchor="middle" font-family="Arial">معسكر</text><text x="450" y="260" fill="#a56cff" font-size="58" font-weight="700" text-anchor="middle" font-family="Arial">الروبوتات الذكية</text><foreignObject x="70" y="330" width="760" height="270"><div xmlns="http://www.w3.org/1999/xhtml" style="color:white;font-size:25px;line-height:1.7;text-align:center;font-family:Arial">معسكر إثرائي تفاعلي لمدة ثلاثة أسابيع يعرف المشاركين بتقنيات الزراعة الذكية والأنظمة الآلية للري والمراقبة، من خلال مشاريع عملية تجمع بين الإلكترونيات والبرمجة وتصميم الحلول المبتكرة للزراعة المستدامة.</div></foreignObject><text x="450" y="665" fill="white" font-size="29" text-anchor="middle" font-family="Arial">8/2 - 8/19 • لمدة ثلاثة أسابيع</text><text x="450" y="725" fill="white" font-size="27" text-anchor="middle" font-family="Arial">9:00 - 12:00 صباحي</text><text x="450" y="775" fill="white" font-size="27" text-anchor="middle" font-family="Arial">4:00 - 7:00 مسائي</text><text x="450" y="1060" fill="white" font-size="42" font-weight="700" text-anchor="middle" font-family="Arial">600 ريال</text></svg>